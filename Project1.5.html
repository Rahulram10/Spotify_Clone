<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>Signup</title>
     <link rel = "stylesheet" href = "./Project1.5.css" >
       <link rel = "stylesheet" href = https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css>
</head>
<body>
    <div class="container">
         <i class="fa-brands fa-spotify" style="color: rgb(249, 252, 250); font-size: 27px;"></i>
        <h1>Sign up to<br>start listening</h1>
        <form action="index.html">
         <label for="userEmail">Email address</label>
         <input type="email" id="userEmail" name="email" placeholder="name@domain.com" required>
         <button type="submit"><b>Next</b></button>
        </form>

        <p>or</p>
        <div class="b1">
        <button><i class="fa-solid fa-mobile" style="color: rgb(243, 245, 250);"></i><span><b>Sign up with phone number</b></span></button>
        <button><i class="fa-brands fa-google" style="color: rgb(243, 245, 250);"></i><span><b>Sign up with Google</b></span></button>
        <button><i class="fa-brands fa-apple" style="color: rgb(243, 245, 250);"></i><span><b>Sign up with Apple</b></span></button>
        </div>
        <p>Already have an account?</p>
        <h5><a href="Project1.6.html"><b>Log in</b></a></h5>
    </div>
